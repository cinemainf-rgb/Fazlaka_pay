name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Fresh Android Folder
        run: flutter create . --org com.fazlaka.paypro --project-name fazlaka_pay_pro --platforms android

      - name: Add Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml

      # 1. طباعة محتوى الملف عشان نشوف شكله
      - name: Show Gradle File
        run: cat android/app/build.gradle.kts

      # 2. تعديل الملف باستخدام Python (أكثر أماناً من sed)
      - name: Update SDK Versions
        run: |
          python3 -c "
          import re
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          
          # استبدال compileSdk
          content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
          # استبدال minSdk
          content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', content)
          
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          "
          echo '--- AFTER MODIFICATION ---'
          cat android/app/build.gradle.kts

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fazlaka-Pay-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
